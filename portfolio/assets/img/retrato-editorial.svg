<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" role="img" aria-label="Ilustração editorial: a desenvolvedora em sua mesa de trabalho, com as torres de Brasília na janela">
  <!-- Ilustração original da edição: tinta sobre papel -->
  <rect width="600" height="800" fill="#f3f2ee"/>

  <!-- moldura interna -->
  <rect x="24" y="24" width="552" height="752" fill="none" stroke="#1b1b1b" stroke-width="3"/>

  <!-- janela com as torres do Congresso -->
  <g stroke="#1b1b1b" fill="none" stroke-width="3">
    <rect x="64" y="64" width="212" height="240"/>
    <line x1="170" y1="64" x2="170" y2="304"/>
    <line x1="64" y1="184" x2="276" y2="184"/>
  </g>
  <g fill="#1b1b1b">
    <!-- torres gêmeas -->
    <rect x="110" y="96" width="14" height="88"/>
    <rect x="132" y="96" width="14" height="88"/>
    <rect x="104" y="92" width="48" height="6"/>
    <!-- cúpulas -->
    <path d="M190 184 a28 22 0 0 1 56 0 z"/>
    <path d="M196 304 a24 18 0 0 0 48 0 z" transform="translate(0,-120)" opacity="0"/>
  </g>
  <!-- sol em meio-tom (pontos), como retícula de jornal -->
  <g fill="#1b1b1b">
    <circle cx="228" cy="124" r="3.4"/><circle cx="242" cy="124" r="3"/><circle cx="256" cy="124" r="2.4"/>
    <circle cx="221" cy="138" r="3"/><circle cx="235" cy="138" r="2.6"/><circle cx="249" cy="138" r="2"/>
    <circle cx="228" cy="152" r="2.4"/><circle cx="242" cy="152" r="2"/><circle cx="256" cy="152" r="1.6"/>
  </g>

  <!-- figura: desenvolvedora sentada, de perfil, digitando -->
  <g fill="#1b1b1b">
    <!-- cabelo curto -->
    <path d="M335 258
             c -52 0 -84 38 -84 84
             c 0 30 10 48 22 62
             c -4 -40 6 -60 20 -74
             c 30 8 62 6 88 -6
             c 10 16 14 38 12 66
             c 16 -16 26 -40 26 -64
             c 0 -44 -32 -68 -84 -68 z"/>
    <!-- rosto (vazado) -->
    <path d="M293 330 c 26 7 54 6 76 -5 c 8 14 12 32 10 52 c -2 26 -22 46 -46 46 c -26 0 -44 -20 -46 -48 c -1 -17 2 -33 6 -45 z"
          fill="#f3f2ee" stroke="#1b1b1b" stroke-width="3"/>
    <!-- olho e sobrancelha -->
    <path d="M306 364 q 12 -8 24 -2" fill="none" stroke="#1b1b1b" stroke-width="4" stroke-linecap="round"/>
    <circle cx="318" cy="378" r="4"/>
    <!-- nariz/boca sugeridos -->
    <path d="M300 396 q -4 8 2 12 M306 418 q 10 4 18 0" fill="none" stroke="#1b1b1b" stroke-width="3" stroke-linecap="round"/>
    <!-- brinco: ponto de cor única da página -->
    <circle cx="352" cy="408" r="5" fill="#8a1f1f"/>
    <!-- pescoço e tronco -->
    <path d="M312 436 l 4 24 c -46 8 -84 34 -92 78 l 0 36 l 180 0 l 0 -52 c 0 -48 -28 -74 -64 -84 l 2 -22 z"/>
    <!-- braço até o teclado -->
    <path d="M236 540 c -18 26 -20 48 -8 60 l 70 0 z" />
  </g>

  <!-- mesa -->
  <rect x="64" y="598" width="472" height="8" fill="#1b1b1b"/>
  <rect x="88" y="606" width="10" height="130" fill="#1b1b1b"/>
  <rect x="502" y="606" width="10" height="130" fill="#1b1b1b"/>

  <!-- notebook com código -->
  <g>
    <path d="M330 530 l 150 0 l 14 68 l -178 0 z" fill="#f3f2ee" stroke="#1b1b1b" stroke-width="4"/>
    <g stroke="#1b1b1b" stroke-width="5" stroke-linecap="round">
      <line x1="356" y1="550" x2="406" y2="550"/>
      <line x1="362" y1="564" x2="442" y2="564"/>
      <line x1="368" y1="578" x2="420" y2="578"/>
    </g>
    <rect x="300" y="598" width="208" height="10" fill="#1b1b1b"/>
  </g>

  <!-- xícara de café com vapor -->
  <g stroke="#1b1b1b" stroke-width="4" fill="#f3f2ee">
    <path d="M136 560 l 44 0 l -6 38 l -32 0 z"/>
    <path d="M180 566 q 18 4 0 22" fill="none"/>
    <path d="M150 536 q 6 -10 0 -18 M166 540 q 6 -10 0 -18" fill="none" stroke-width="3"/>
  </g>

  <!-- legenda de rodapé da ilustração -->
  <g fill="#1b1b1b" font-family="Georgia, serif" font-style="italic" font-size="20">
    <text x="300" y="750" text-anchor="middle">editora de código &amp; café — Brasília, DF</text>
  </g>
</svg>
